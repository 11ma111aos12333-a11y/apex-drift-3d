name: Build Android APK (Apex Drift 3D)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Capacitor Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure pre-installed Android SDK & accept licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER=$(ls "$SDK_DIR"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          fi

      - name: Install dependencies & Capacitor Android CLI
        run: |
          npm install
          npm install --no-save @capacitor/cli@^8.6.2 @capacitor/android@^8.6.2

      - name: Build production web bundle
        run: npm run build

      - name: Scaffold Capacitor Android & preserve custom Bluetooth plugin
        env:
          CI: "true"
        run: |
          mkdir -p /tmp/custom_android
          cp android/app/src/main/AndroidManifest.xml /tmp/custom_android/AndroidManifest.xml
          cp android/app/src/main/java/com/apexdrift/racing/MainActivity.java /tmp/custom_android/MainActivity.java
          cp android/app/src/main/java/com/apexdrift/racing/BluetoothMultiplayerPlugin.java /tmp/custom_android/BluetoothMultiplayerPlugin.java

          rm -rf android
          npx cap add android

          cp /tmp/custom_android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp /tmp/custom_android/MainActivity.java android/app/src/main/java/com/apexdrift/racing/MainActivity.java
          cp /tmp/custom_android/BluetoothMultiplayerPlugin.java android/app/src/main/java/com/apexdrift/racing/BluetoothMultiplayerPlugin.java

          npx cap sync android

      - name: Build Android APK (assembleDebug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK artifact
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/Apex-Drift-3D.apk
          ls -lh release-apk/Apex-Drift-3D.apk

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Apex-Drift-3D-Android-APK
          path: release-apk/Apex-Drift-3D.apk
          retention-days: 90

      - name: Publish Direct Download Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Apex Drift 3D — Android APK
          body: |
            نسخة الأندرويد الجاهزة (APK) من لعبة **أبيكس دريفت 3D** مبنية تلقائياً من آخر نسخة على GitHub.
            - تدعم القيادة ثلاثية الأبعاد بـ WebGL، الجراج، العالم المفتوح، وضع السباق، واللعب الجماعي عبر الإنترنت والبلوتوث.
          files: release-apk/Apex-Drift-3D.apk
          prerelease: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
